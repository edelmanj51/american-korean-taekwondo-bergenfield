REVIEWER_1_NAME: "Jason Ainspan"
REVIEWER_1_DATE: "8 months ago"
REVIEWER_1_TEXT: "We're so happy this Taekwondo school opened a second location! It's close, convenient, and gives our family so much more flexibility with class times. The same amazing instruction carries over here — Master James and the team are just as patient, encouraging, and professional. My son continues to build confidence and discipline with every class. I also really appreciate the play area for siblings — it makes it so much easier to bring my younger kids along. The new space is clean, welcoming, and thoughtfully set up. We couldn't ask for a better experience!"

REVIEWER_2_NAME: "Herald Aguilar"
REVIEWER_2_DATE: "8 months ago"
REVIEWER_2_TEXT: "This is a very great school — it's one of the best schools that we recommend. The coach and the instructors are very nice. We are treated like family, especially my son."

REVIEWER_3_NAME: "Jaycee Aguilar"
REVIEWER_3_DATE: "8 months ago"
REVIEWER_3_TEXT: "Before, my son didn't want to do Taekwondo, but when he started at this school he enjoyed every single day of his class. Now my son is part of the AKT Team — thanks to Master James, Instructor Daria, and Instructor Ethan."

REVIEWER_4_NAME: "Nei Kim"
REVIEWER_4_DATE: "8 months ago"
REVIEWER_4_TEXT: "We're so thankful for Master James and Daria. Their positive energy and care make every class special. My daughter always looks forward to Taekwondo! Highly recommend this school to any family looking for a place where kids can grow strong in both body and character!"

REVIEWER_5_NAME: "Lanfang Dong"
