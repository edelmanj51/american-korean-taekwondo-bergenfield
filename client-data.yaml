ABOUT_TEXT: "American Korean Taekwondo Team Center brought its Kukkiwon- and USA Taekwondo-certified curriculum to Bergenfield in 2025, expanding from its original Teaneck school founded in 2016. Known as the 'Home of National Champions' in the sparring division, the academy builds martial artists around five core values — focus, confidence, respect, self-control, and mental strength — in a safe, structured, and inspiring environment for every age."

INSTRUCTOR_1_NAME: "Master James Koh"
INSTRUCTOR_1_PHOTO: images/instructors/instructor-1/photo.jpg
INSTRUCTOR_1_TITLE: "Founder & Head Master — 6th Dan Black Belt"
INSTRUCTOR_1_BIO: "Master James Koh is a Kukkiwon International Master Certified 6th Dan Black Belt with more than 20 years of teaching experience and 30+ years of training. A former elite competitor with 15 years of sparring experience, he holds USA Taekwondo Gold, South Korea National Gold, and International Gold medals. He founded American Korean Taekwondo in Teaneck in 2016 and expanded to Bergenfield in 2025. He's joined by a certified coaching staff including 4th Degree Black Belt Daria Kalyniuk (SafeSport-certified coach and USA Taekwondo licensed referee) and 3rd Dan Instructor Ethan."

